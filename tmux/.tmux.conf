# ~/.tmux.conf
# Configured for Nord Light Dotfiles

# --- General Settings ---
# Change prefix key to Ctrl-a (more comfortable than Ctrl-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Start window and pane numbering at 1 (instead of 0)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Super fast escape-time response (vital for Vim responsiveness)
set -sg escape-time 10

# Enable mouse support (resizing, clicking windows, scrolling)
set -g mouse on

# Set 24-bit terminal colors (TrueColor support)
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# --- Keybindings ---
# Split window using intuitive keys (and open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload configuration shortcut
bind r source-file ~/.tmux.conf \; display-message "Tmux configuration reloaded!"

# Resize panes using Vim movement keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Theme Customization (Nord Dark) ---
# Status bar positioning and layout
set -g status-position bottom
set -g status-justify left
set -g status-bg "#2e3440" # Nord 0 (Dark Polar Night background)
set -g status-fg "#d8dee9" # Nord 4 (Light Snow Storm text)
set -g status-interval 2

# Status left/right widgets
set -g status-left-length 40
set -g status-left "#[bg=#88c0d0,fg=#2e3440,bold] ❐ #S #[bg=#2e3440,fg=#88c0d0,nobold]"

set -g status-right-length 150
set -g status-right "#[fg=#3b4252,bg=#2e3440]#[fg=#d8dee9,bg=#3b4252]  #H #[fg=#88c0d0,bg=#3b4252]#[bg=#88c0d0,fg=#2e3440,bold] %Y-%m-%d %H:%M "

# Inactive Window status tabs
set -g window-status-format "#[fg=#2e3440,bg=#3b4252]#[fg=#d8dee9,bg=#3b4252] #I: #W #[fg=#3b4252,bg=#2e3440]"
# Active Window status tabs
set -g window-status-current-format "#[fg=#2e3440,bg=#88c0d0]#[fg=#2e3440,bg=#88c0d0,bold] #I: #W #[fg=#88c0d0,bg=#2e3440]"

# Pane borders
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"

# Command line message colors
set -g message-style "bg=#88c0d0,fg=#2e3440,bold"

# --- Plugins via TPM (Tmux Plugin Manager) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator' # Seamless vim-split tmux-pane navigation
set -g @plugin 'tmux-plugins/tmux-resurrect'     # Persist sessions across reboot
set -g @plugin 'tmux-plugins/tmux-continuum'     # Auto saving sessions

# Continuum settings
set -g @continuum-restore 'on'

# Run Tmux Plugin Manager (keep at bottom of file)
run '~/.tmux/plugins/tpm/tpm'
