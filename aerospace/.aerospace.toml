# ~/.aerospace.toml - German QWERTZ / MacBook Pro 14" i3-like Config

config-version = 2
start-at-login = false

# Normalizations
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true

[gaps]
inner.horizontal = 6
inner.vertical   = 6
outer.left       = 6
outer.bottom     = 6
outer.top        = 6
outer.right      = 6

[mode.main.binding]

# -------------------------------------------------------------
# Window Focus (Vim-style HJKL)
# -------------------------------------------------------------
alt-ctrl-h = 'focus left'
alt-ctrl-j = 'focus down'
alt-ctrl-k = 'focus up'
alt-ctrl-l = 'focus right'

# -------------------------------------------------------------
# Move Window
# -------------------------------------------------------------
alt-ctrl-shift-h = 'move left'
alt-ctrl-shift-j = 'move down'
alt-ctrl-shift-k = 'move up'
alt-ctrl-shift-l = 'move right'

# -------------------------------------------------------------
# Layout Splitting & Toggle (i3 equivalents)
# -------------------------------------------------------------
alt-ctrl-b = 'split horizontal'
alt-ctrl-v = 'split vertical'
alt-ctrl-e = 'layout tiles horizontal vertical'
alt-ctrl-s = 'layout accordion horizontal vertical'
alt-ctrl-f = 'fullscreen'


# -------------------------------------------------------------
# Workspaces: U & I (MacBook), O & P (External Screen)
# -------------------------------------------------------------
alt-ctrl-u = 'workspace u'
alt-ctrl-i = 'workspace i'
alt-ctrl-o = 'workspace o'
alt-ctrl-p = 'workspace p'

# Move window to workspace
alt-ctrl-shift-u = 'move-node-to-workspace u'
alt-ctrl-shift-i = 'move-node-to-workspace i'
alt-ctrl-shift-o = 'move-node-to-workspace o'
alt-ctrl-shift-p = 'move-node-to-workspace p'

# -------------------------------------------------------------
# Dynamic Monitor Force Assignment
# -------------------------------------------------------------
[workspace-to-monitor-force-assignment]
# Workspaces on MacBook screen
u = 'built-in'
i = 'built-in'

# Workspaces on ANY external display / virtual screen (falls back to built-in when unplugged)
o = ['^((?!built-in).)*$', 'built-in']
p = ['^((?!built-in).)*$', 'built-in']

# -------------------------------------------------------------
# Resize Mode (i3 style)
# -------------------------------------------------------------
alt-ctrl-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

# -------------------------------------------------------------
# Window Placement Routing Rules
# -------------------------------------------------------------
[[on-window-detected]]
if.app-name-regex-substring = 'safari|chrome'
run = 'move-node-to-workspace o'

[[on-window-detected]]
if.app-name-regex-substring = 'slack|spotify'
run = 'move-node-to-workspace u'

# Force macOS system preferences/settings to float instead of tile
[[on-window-detected]]
if.app-name-regex-substring = 'settings|preferences'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'telegram|whatsapp'
run = 'layout floating'
